<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>

    <button id="myBtn" class="book">Open Modal</button>
    <!-- The Modal -->
    <div id="myModal" class="modal">

        <!-- Modal content -->
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="container" id="myModal">
                <div class="checkoutLayout" id="modal-content">

                    <div class="returnCart">
                        <a href="/">keep shopping</a>
                        <h3>Proceed to Payment</h3>
                        <div class="list">

                            <div class="item">
                                <img src="images/1.webp">
                                <div class="info">
                                    <div class="name">PRODUCT 1</div>
                                    <div class="price">$22/1 product</div>
                                </div>
                                <div class="quantity">5</div>
                                <div class="returnPrice">$433.3</div>
                            </div>

                        </div>

                    </div>
                    <div class="right">
                        <h1>Checkout</h1>

                        <div class="form">
                            <div class="group">
                                <label for="name">Full Name</label>
                                <input type="text" name="name" id="name">
                            </div>

                            <div class="group">
                                <label for="phone">Phone Number</label>
                                <input type="text" name="phone" id="phone">
                            </div>

                            <div class="group">
                                <label for="address">Address</label>
                                <input type="text" name="address" id="address">
                            </div>

                            <div class="group">
                                <label for="country">Country</label>
                                <select name="country" id="country">
                                    <option value="">Choose..</option>
                                    <option value="">Kingdom</option>
                                </select>
                            </div>

                            <div class="group">
                                <label for="city">City</label>
                                <select name="city" id="city">
                                    <option value="">Choose..</option>
                                    <option value="">London</option>
                                </select>
                            </div>
                        </div>
                        <div class="return">
                            <div class="row">
                                <div>Total Quantity</div>
                                <div class="totalQuantity">70</div>
                            </div>
                            <div class="row">
                                <div>Total Price</div>
                                <div class="totalPrice">$900</div>
                            </div>
                        </div>
                        <button class="buttonCheckout">CHECKOUT</button>
                    </div>


                </div>

            </div>
        </div>

    </div>

</body>

</html>
